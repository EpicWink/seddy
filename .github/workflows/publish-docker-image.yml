name: publish-docker

on:
  workflow_run:
    workflows: [publish]
    types: [completed]

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Compute version from tag
      id: compute-version
      run: |
        if [[ "${{ github.ref_name }}" =~ '^v\d+\.\d+\.\d+((a|b|rc)\d+)?$' ]]; then
            echo "version=$(grep -P -o '\d+\.\d+\.\d+((a|b|rc)\d+)?$')" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: linux/arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        platforms: linux/amd64,linux/arm64

    - name: Login to DockerHub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: epicwink
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and push image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        build-args: |
          SEDDY_REQUIREMENT= == ${{ steps.compute-version.outputs.version }}
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: epicwink/seddy:${{ steps.compute-version.outputs.version }}

    - name: Check tag
      id: check-tag
      run: |
        if [[ "${{ steps.compute-version.outputs.version }}" =~ '^\d+\.\d+\.\d+$' ]]; then
          echo match=true >> "$GITHUB_OUTPUT"
        fi

    - name: Publish latest image
      if: steps.check-tag.outputs.match == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        build-args: |
          SEDDY_REQUIREMENT= == ${{ steps.compute-version.outputs.version }}
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: epicwink/seddy:latest
